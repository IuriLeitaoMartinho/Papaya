<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D96E34">
<meta name="description" content="Papaya — guia de parentalidade dos 0 aos 2 anos: dicas por idade, pesquisa no guia e tarefas da família. Funciona offline, dados só no teu telemóvel.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/estilo.css">
<title>Papaya — Guia dos Pais</title>
</head>
<body>

<header>
  <div>
    <h1 id="cabecalhoNome">Papaya</h1>
    <div class="idade" id="cabecalhoIdade"></div>
  </div>
  <button id="botaoDefinicoes" aria-label="Definições">⚙</button>
</header>

<!-- Cada separador é uma <section>; a navegação mostra/esconde consoante o hash -->
<main>
  <section id="vista-hoje" hidden></section>
  <section id="vista-guia" hidden></section>
  <section id="vista-tarefas" hidden></section>
  <section id="vista-montessori" hidden></section>
</main>

<!-- Navegação: botões flutuantes verticais nas margens (esquerda e direita) -->
<nav class="nav-flutuante" aria-label="Navegação principal">
  <div class="nav-cluster nav-esq">
    <a href="#hoje" data-sep="hoje" class="nav-btn"><span class="icone">☀</span><span class="rot">Hoje</span></a>
    <button type="button" id="fabMamada" class="nav-btn fab-mamada"><span class="icone">🍼</span><span class="rot">Mamada</span></button>
  </div>
  <div class="nav-cluster nav-dir">
    <a href="#guia" data-sep="guia" class="nav-btn"><span class="icone">📖</span><span class="rot">Guia</span></a>
    <a href="#tarefas" data-sep="tarefas" class="nav-btn"><span class="icone">✓</span><span class="rot">Tarefas</span></a>
    <a href="#montessori" data-sep="montessori" class="nav-btn"><span class="icone">🌱</span><span class="rot">Montessori</span></a>
  </div>
</nav>

<div class="fundo-folha" id="fundoFolha"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
